
services:
  db:
    image: mysql:8
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - apartment_network
    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -h 127.0.0.1 --silent"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  app:
    image: ${APP_IMAGE:-sheesshasnain/apartment-booking:1.0.0}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - apartment_network

  frontend:
    image: apartment-frontend:1.0.2
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - app
    networks:
      - apartment_network

volumes:
  mysql_data:

networks:
  apartment_network:
    driver: bridge
